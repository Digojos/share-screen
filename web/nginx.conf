server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # A rota /room/CODIGO existe so no cliente. Sem este fallback, recarregar a
  # pagina dentro de uma sala devolve 404 do nginx em vez do app.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Os assets tem hash no nome; podem ser cacheados agressivamente.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
