# Override para publicar atras de um proxy que ja existe no servidor —
# no caso, o nginx do projeto `nades`, que ja ocupa as portas 80 e 443.
#
#   docker compose -f docker-compose.yml -f docker-compose.proxy.yml up -d
#
# O que muda:
#
# 1. Os containers entram na rede do outro projeto, para o nginx de la alcancar
#    estes por nome em vez de por porta do host.
#
# 2. Ganham ALIASES proprios. Isso nao e cosmetico: o projeto `nades` ja tem um
#    servico chamado `server`, e sem alias os dois responderiam pelo mesmo nome
#    na rede compartilhada — o proxy acertaria o alvo errado, de forma
#    intermitente e dificil de diagnosticar.
#
# 3. Deixam de publicar portas no host. Alem de desnecessario (o proxy alcanca
#    pela rede interna), evita colisao: o `nades` ja publica a 3001, que e a
#    porta padrao da sinalizacao daqui.

services:
  server:
    ports: !reset []
    networks:
      default:
      proxy:
        aliases:
          - share-screen-server

  web:
    ports: !reset []
    networks:
      default:
      proxy:
        aliases:
          - share-screen-web

networks:
  proxy:
    external: true
    # O nome vem da PASTA do outro projeto, nao do nome dele: no servidor o
    # repositorio fica em /opt/nades/nadeshub, entao a rede e `nadeshub_default`.
    # Confirme com `docker network ls | grep default`.
    name: ${PROXY_NETWORK:-nadeshub_default}
