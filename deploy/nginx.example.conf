# Bloco para ADICIONAR ao nginx que ja existe no servidor — nao e um nginx
# novo, e nao mexe nos blocos das outras aplicacoes.
#
# ---------------------------------------------------------------------------
# ORDEM IMPORTA
#
# Este arquivo e HTTP puro de proposito. O `certbot --nginx` procura um bloco
# com o `server_name` desejado e o converte para HTTPS sozinho, adicionando as
# linhas de certificado e o redirecionamento da 80.
#
# Comecar com um bloco que ja aponta para o certificado nao funciona: o arquivo
# ainda nao existe, `nginx -t` falha, e o certbot nao roda porque o nginx nao
# recarrega. Um trava o outro.
#
#   1. copie este arquivo para /etc/nginx/sites-available/share-screen.conf
#   2. ajuste o server_name (e as portas, se mudou no .env)
#   3. ln -s para sites-enabled/ ; sudo nginx -t ; sudo systemctl reload nginx
#   4. sudo certbot --nginx -d share.SEU-IP-COM-TRACOS.sslip.io
#
# Depois do passo 4 o proprio certbot reescreve este bloco com TLS.
#
# ---------------------------------------------------------------------------
# CONFLITO COM AS OUTRAS APLICACOES
#
# Nao ha, desde que `nginx -t` passe — e se nao passar, nada e aplicado: o
# nginx continua rodando com a configuracao anterior. Tres pontos de atencao:
#
# - `server_name` unico. Como o nome tem o IP embutido, ninguem mais vai usar.
# - Sem `default_server` aqui. Dois blocos com `default_server` na mesma porta
#   fazem o nginx recusar a configuracao inteira, derrubando tudo no reload.
# - Nada de `http2 on;` neste arquivo. Essa forma so existe no nginx 1.25.1+;
#   em versoes anteriores e "unknown directive" e `nginx -t` falha. O certbot
#   cuida disso conforme a versao instalada.
#
# ---------------------------------------------------------------------------
# SOBRE OS DOIS NGINX
#
# Ha o seu (TLS + proxy) e outro dentro do container `web`, servindo os
# estaticos. A duplicacao mantem o front empacotado: `docker compose up` sobe a
# aplicacao inteira e o deploy nao depende de copiar arquivos. O custo e um
# salto em localhost, irrelevante.
#
# Para servir os estaticos direto pelo seu nginx, nao suba o container `web` e
# troque o `location /` por:
#
#   location / {
#       root /var/www/share-screen;
#       try_files $uri $uri/ /index.html;   # /room/CODIGO e rota do cliente
#   }
#
# O `try_files` nao e opcional: sem ele, recarregar dentro de uma sala da 404.

server {
    listen 80;
    server_name share.SEU-IP-COM-TRACOS.sslip.io;

    # --- Front (container `web`) ---
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Sinalizacao (container `server`) ---
    #
    # ATENCAO: o Socket.IO precisa do upgrade para WebSocket. Sem as linhas de
    # Upgrade/Connection abaixo, a pagina carrega inteira e NADA funciona — a
    # sala nao e criada, ninguem entra — o que parece bug da aplicacao e nao de
    # proxy. E o erro mais comum nesta configuracao.
    location /socket.io/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;

        # A conexao fica ociosa entre eventos; o padrao de 60s a derrubaria e o
        # cliente ficaria reconectando sem parar.
        proxy_read_timeout  1h;
        proxy_send_timeout  1h;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
    }
}

# Front e sinalizacao ficam na MESMA origem — o nginx serve `/` e repassa
# `/socket.io/` e `/api/`. Com isso nao ha origem cruzada, o CORS deixa de
# existir e basta um certificado.
#
# Depois que o certbot converter este bloco, reconstrua o front com o endereco
# final (a URL e embutida no bundle em tempo de build):
#
#   VITE_SIGNALING_URL=https://share.SEU-IP.sslip.io docker compose build web
#   docker compose up -d
#
# O coturn, se ativado, NAO passa por aqui: usa UDP em portas proprias e precisa
# delas abertas direto no firewall (3478 e a faixa de relay).
