# Bloco para ADICIONAR ao nginx que ja existe no servidor — nao e um nginx
# novo. Copie para sites-available/ (ou conf.d/), ajuste o server_name, e rode
# `nginx -t && systemctl reload nginx`.
#
# A ideia central: front e sinalizacao na MESMA origem. O nginx serve o front
# em `/` e repassa `/socket.io/` e `/api/` para o servidor. Com isso o CORS
# deixa de existir (nao ha origem cruzada), basta um unico certificado, e so a
# 443 fica exposta.
#
# ---------------------------------------------------------------------------
# Sobre os DOIS nginx
#
# Neste desenho ha o seu nginx (TLS + proxy) e outro dentro do container `web`,
# servindo os arquivos estaticos. A duplicacao e proposital: mantem o front
# empacotado, entao `docker compose up` sobe a aplicacao inteira e o deploy nao
# depende de copiar arquivos para o servidor. O custo e um salto extra em
# localhost, irrelevante.
#
# Se preferir servir os estaticos direto pelo seu nginx, e possivel: nao suba o
# container `web`, gere o build e aponte a raiz para ele —
#
#   location / {
#       root /var/www/share-screen;
#       try_files $uri $uri/ /index.html;   # rota /room/CODIGO e do cliente
#   }
#
# O `try_files` nao e opcional: sem ele, recarregar a pagina dentro de uma sala
# devolve 404. Em troca, cada deploy passa a exigir `npm run build` e copiar
# `web/dist` para o servidor.
#
# Sem dominio proprio, use sslip.io: `203-0-113-10.sslip.io` ja resolve para
# 203.0.113.10 sem cadastro nenhum, e o Let's Encrypt emite certificado normal
# para esse nome:
#
#   certbot --nginx -d share.203-0-113-10.sslip.io

server {
    listen 443 ssl;
    http2 on;
    server_name share.203-0-113-10.sslip.io;

    ssl_certificate     /etc/letsencrypt/live/share.203-0-113-10.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/share.203-0-113-10.sslip.io/privkey.pem;

    # --- Front (container `web`) ---
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Sinalizacao (container `server`) ---
    #
    # ATENCAO: o Socket.IO precisa do upgrade para WebSocket. Sem as tres linhas
    # de Upgrade/Connection abaixo, a pagina carrega inteira e NADA funciona —
    # a sala nao e criada, ninguem entra — o que parece bug da aplicacao e nao
    # de proxy. E o erro mais comum nesta configuracao.
    location /socket.io/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;

        # A conexao fica ociosa entre eventos; o padrao de 60s a derrubaria e o
        # cliente ficaria reconectando sem parar.
        proxy_read_timeout  1h;
        proxy_send_timeout  1h;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
    }
}

server {
    listen 80;
    server_name share.203-0-113-10.sslip.io;
    return 301 https://$host$request_uri;
}

# Depois de configurar, reconstrua o front apontando para a MESMA origem — a
# URL da sinalizacao e embutida no bundle em tempo de build:
#
#   VITE_SIGNALING_URL=https://share.203-0-113-10.sslip.io docker compose build web
#   SERVER_PORT=3001 WEB_PORT=8080 \
#     CORS_ORIGIN=https://share.203-0-113-10.sslip.io \
#     docker compose up -d mysql server web
#
# O coturn, se ativado, NAO passa por aqui: usa UDP em portas proprias e precisa
# delas abertas direto no firewall (3478 e a faixa de relay).
