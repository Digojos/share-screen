services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      PORT: 3001
      # Origem publica do front. Em producao e o dominio servido pelo nginx —
      # se nao bater, o `fetch` de /api/ice leva CORS, o app cai no fallback e
      # anuncia "TURN nao configurado" mesmo com TURN no ar.
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
      STUN_URLS: ${STUN_URLS:-stun:stun.l.google.com:19302,stun:stun1.l.google.com:19302}
      TURN_URLS: ${TURN_URLS:-}
      TURN_SECRET: ${TURN_SECRET:-}
      # Variaveis separadas, e nao uma URL: interpolar a senha numa URL quebra
      # em silencio quando ela contem `/`, `@` ou `#` — caracteres comuns em
      # `openssl rand -base64`. O sintoma seria "Access denied", que aponta
      # para o lugar errado.
      #
      # `mysql` e o nome do servico na rede do compose, nao `localhost`, que
      # dentro do container aponta para o proprio container. A porta aqui e
      # sempre 3306: MYSQL_PORT no .env controla apenas o mapeamento no host.
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: ${MYSQL_USER:-share}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-share}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-share_screen}
      MAX_PARTICIPANTS: ${MAX_PARTICIPANTS:-6}
      HOST_GRACE_SECONDS: ${HOST_GRACE_SECONDS:-60}
    ports:
      # Publicado so em 127.0.0.1: numa VPS, `0.0.0.0` exporia a sinalizacao na
      # internet por HTTP puro, driblando o nginx e o TLS. O proxy alcanca por
      # localhost. Use BIND_HOST=0.0.0.0 apenas para testar de outra maquina na
      # rede local.
      - '${BIND_HOST:-127.0.0.1}:${SERVER_PORT:-3001}:3001'
    depends_on:
      mysql:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        # Embutida no bundle em tempo de build: trocar exige rebuild.
        VITE_SIGNALING_URL: ${VITE_SIGNALING_URL:-http://localhost:3001}
    ports:
      # Mesmo motivo: quem entrega o front para fora e o nginx, com certificado.
      # Exposto direto, alguem acessaria por http://ip:8080 — onde compartilhar
      # tela nao funciona, por falta de contexto seguro.
      - '${BIND_HOST:-127.0.0.1}:${WEB_PORT:-8080}:80'
    depends_on:
      - server

  coturn:
    image: coturn/coturn:4.6-alpine
    # network_mode: host e o caminho mais confiavel para TURN em Linux — o relay
    # usa uma faixa ampla de portas UDP que ficaria lenta de mapear uma a uma.
    # No Docker Desktop (Windows/macOS) use a secao `ports` abaixo.
    ports:
      - '3478:3478/udp'
      - '3478:3478/tcp'
      - '49160-49200:49160-49200/udp'
    command: >
      -n --log-file=stdout
      --lt-cred-mech
      --use-auth-secret
      --static-auth-secret=${TURN_SECRET:-troque-este-segredo}
      --realm=share-screen.local
      --min-port=49160
      --max-port=49200
      --no-tls
      --no-dtls
      --no-cli

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-share_screen}
      MYSQL_USER: ${MYSQL_USER:-share}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-share}
    ports:
      # NUNCA em 0.0.0.0: seria um MySQL aberto na internet, com a senha do
      # compose. O servidor fala com ele pela rede interna do Docker, entao esta
      # publicacao existe apenas para ferramentas locais.
      - '127.0.0.1:${MYSQL_PORT:-3306}:3306'
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      # O servidor tenta reconectar no boot, mas o healthcheck evita que
      # `docker compose up` sinalize "pronto" antes do MySQL aceitar conexao.
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-uroot', '-p${MYSQL_ROOT_PASSWORD:-root}']
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql-data:
