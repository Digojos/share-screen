services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      PORT: 3001
      # Origem do front servido pelo nginx abaixo.
      CORS_ORIGIN: http://localhost:8080
      STUN_URLS: stun:stun.l.google.com:19302,stun:stun1.l.google.com:19302
      # Nome do servico na rede do compose — nao `localhost`, que dentro do
      # container aponta para o proprio container.
      DATABASE_URL: mysql://${MYSQL_USER:-share}:${MYSQL_PASSWORD:-share}@mysql:3306/${MYSQL_DATABASE:-share_screen}
      MAX_PARTICIPANTS: ${MAX_PARTICIPANTS:-6}
      HOST_GRACE_SECONDS: ${HOST_GRACE_SECONDS:-60}
    ports:
      # A porta no host e configuravel para nao colidir com um `npm run dev`
      # em andamento, e porque num servidor ela costuma ser outra.
      - '${SERVER_PORT:-3001}:3001'
    depends_on:
      mysql:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        # Embutida no bundle em tempo de build: trocar exige rebuild.
        VITE_SIGNALING_URL: ${VITE_SIGNALING_URL:-http://localhost:3001}
    ports:
      - '${WEB_PORT:-8080}:80'
    depends_on:
      - server

  coturn:
    image: coturn/coturn:4.6-alpine
    # network_mode: host e o caminho mais confiavel para TURN em Linux — o relay
    # usa uma faixa ampla de portas UDP que ficaria lenta de mapear uma a uma.
    # No Docker Desktop (Windows/macOS) use a secao `ports` abaixo.
    ports:
      - '3478:3478/udp'
      - '3478:3478/tcp'
      - '49160-49200:49160-49200/udp'
    command: >
      -n --log-file=stdout
      --lt-cred-mech
      --use-auth-secret
      --static-auth-secret=${TURN_SECRET:-troque-este-segredo}
      --realm=share-screen.local
      --min-port=49160
      --max-port=49200
      --no-tls
      --no-dtls
      --no-cli

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-share_screen}
      MYSQL_USER: ${MYSQL_USER:-share}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-share}
    ports:
      # Use MYSQL_PORT para nao colidir com um MySQL ja instalado na maquina.
      - '${MYSQL_PORT:-3306}:3306'
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      # O servidor tenta reconectar no boot, mas o healthcheck evita que
      # `docker compose up` sinalize "pronto" antes do MySQL aceitar conexao.
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-uroot', '-p${MYSQL_ROOT_PASSWORD:-root}']
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql-data:
